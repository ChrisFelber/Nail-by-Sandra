<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f0eb"><title>Comptabilité — Nail by Sandra</title><style>
:root{--bg:#f8f3ef;--paper:#fffdfa;--ink:#252120;--muted:#817773;--line:#e5d9d2;--accent:#8f685f;--soft:#f1e7e1;--danger:#8b3f34;--shadow:0 18px 50px rgba(66,48,42,.08)}*{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:1080px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-end}.eyebrow{text-transform:uppercase;letter-spacing:.22em;font-size:10px;color:var(--accent);font-weight:700}.title{font:400 42px/1.05 Georgia,serif;margin:10px 0}.muted{color:var(--muted);line-height:1.6}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:0;border-radius:999px;padding:11px 16px;background:var(--ink);color:white;font-weight:650;cursor:pointer}.btn.secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn.danger{background:var(--danger)}.toolbar{display:flex;justify-content:space-between;gap:14px;align-items:center;margin:22px 0}.toolbar input{border:1px solid var(--line);border-radius:14px;background:white;padding:12px;font:inherit}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:16px}.stat,.panel{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow);min-width:0;max-width:100%;overflow:hidden}.stat small{display:block;color:var(--muted)}.stat strong{display:block;font:400 30px Georgia,serif;margin-top:8px}.grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);gap:16px;min-width:0}.panel h2{font:400 27px Georgia,serif;margin:0 0 16px}.row{display:grid;grid-template-columns:100px minmax(0,1fr) auto;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);align-items:start;min-width:0;max-width:100%}.row>div{min-width:0}.row:last-child{border-bottom:0}.row small,.row p{color:var(--muted);margin:4px 0 0;line-height:1.45;overflow-wrap:anywhere}.amount{font-weight:700;white-space:nowrap}.expense-form{display:grid;gap:10px;min-width:0}.expense-form input,.expense-form select{width:100%;max-width:100%;min-width:0;border:1px solid var(--line);border-radius:12px;padding:12px;background:white;font:inherit}.expense-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);min-width:0}.expense-item>div{min-width:0}.expense-item:last-child{border-bottom:0}.empty,.loading{padding:22px 0;text-align:center;color:var(--muted)}.error{color:var(--danger);margin-top:10px}@media(max-width:760px){.wrap{width:calc(100% - 40px);max-width:430px;margin-left:auto;margin-right:auto;padding:14px 0;overflow:hidden}.top{align-items:flex-start;flex-direction:column}.actions,.actions .btn{width:100%}.stats{width:100%;max-width:100%;margin-left:0;margin-right:0;grid-template-columns:1fr}.grid{display:block;width:100%;max-width:100%;min-width:0}.grid>.panel{width:100%;max-width:100%;margin-left:0;margin-right:0;margin-bottom:16px}.toolbar{display:block;width:100%;max-width:100%;min-width:0;margin:22px 0;overflow:hidden}.toolbar input[type=month]{display:block;width:100%;max-width:100%;min-width:0;inline-size:100%;max-inline-size:100%;min-inline-size:0;margin:0 0 14px;padding:12px;border:1px solid var(--line);border-radius:14px;background:#fff;font:inherit;-webkit-appearance:none;appearance:none}.toolbar .btn{display:block;width:100%;max-width:100%;min-width:0}.panel{width:100%;max-width:100%;padding:20px 18px}.row{display:grid;grid-template-columns:88px minmax(0,1fr);gap:12px;width:100%;max-width:100%;margin:0;padding:14px 0;overflow:hidden}.row>div:first-child strong{display:block;font-size:13px;line-height:1.25;white-space:nowrap;letter-spacing:-.02em}.row>div:first-child small{display:block;font-size:12px;white-space:nowrap}.row>div:nth-child(2) strong,.row>div:nth-child(2) p,.row>div:nth-child(2) small{max-width:100%;overflow-wrap:anywhere}.amount{grid-column:2;text-align:left;white-space:nowrap}.expense-form input[type=date]{display:block;width:100%;max-width:100%;min-width:0;inline-size:100%;max-inline-size:100%;min-inline-size:0;-webkit-appearance:none;appearance:none}.expense-item{grid-template-columns:minmax(0,1fr)}.expense-item .btn{width:100%}}
</style></head><body><main class="wrap"><div class="top"><div><div class="eyebrow">Espace Sandra</div><h1 class="title">Comptabilité</h1><p class="muted">Vue mensuelle des prestations confirmées et des dépenses.</p></div><div class="actions"><button class="btn secondary" onclick="location.href='/accounting-confirm.html'">Confirmer les prestations</button><button class="btn secondary" onclick="location.href='/admin.html'">Retour à l'espace Sandra</button></div></div><div class="toolbar"><input id="month" type="month"><button class="btn" id="exportBtn">Exporter le mois en CSV</button></div><section class="stats"><div class="stat"><small>Total encaissé</small><strong id="revenue">—</strong></div><div class="stat"><small>Total dépenses</small><strong id="expensesTotal">—</strong></div><div class="stat"><small>Solde</small><strong id="balance">—</strong></div></section><div class="grid"><section class="panel"><h2>Prestations encaissées</h2><div id="revenues" class="loading">Chargement…</div></section><section class="panel"><h2>Ajouter une dépense</h2><form id="expenseForm" class="expense-form"><input id="expenseDate" type="date" required><select id="expenseCategory" required><option value="">Catégorie</option><option>Matériel</option><option>Produits</option><option>Loyer</option><option>Formation</option><option>Publicité</option><option>Équipement</option><option>Frais administratifs</option><option>Autre</option></select><input id="expenseDescription" placeholder="Description" maxlength="180" required><input id="expenseAmount" type="number" min="0.01" step="0.05" placeholder="Montant CHF" required><button class="btn">Ajouter la dépense</button><div id="expenseError" class="error"></div></form><h2 style="margin-top:28px">Dépenses du mois</h2><div id="expenseList"></div></section></div></main><script>
const $=id=>document.getElementById(id);function money(c){return new Intl.NumberFormat('fr-CH',{style:'currency',currency:'CHF',minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(c||0)/100)}function esc(s){return String(s||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]||c))}function iso(d){return String(d||'').slice(0,10)}
function currentMonth(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}
async function load(){const month=$('month').value;try{const r=await fetch('/api/admin-accounting?month='+encodeURIComponent(month),{credentials:'same-origin'}),d=await r.json();if(r.status===401){location.href='/admin.html';return}if(!r.ok)throw new Error(d.error||'Chargement impossible.');$('revenue').textContent=money(d.summary.revenue_cents);$('expensesTotal').textContent=money(d.summary.expense_cents);$('balance').textContent=money(d.summary.balance_cents);renderRevenue(d.appointments||[]);renderExpenses(d.expenses||[])}catch(e){$('revenues').className='error';$('revenues').textContent=e.message}}
function renderRevenue(rows){const box=$('revenues');if(!rows.length){box.className='empty';box.textContent='Aucune prestation confirmée pour ce mois.';return}box.className='';box.innerHTML=rows.map(r=>`<div class="row"><div><strong>${esc(iso(r.appointment_date))}</strong><small>${String(r.appointment_start_time||'').slice(0,5)}</small></div><div><strong>${esc((r.customer_first_name+' '+r.customer_last_name).trim())}</strong><p>${esc(r.booked_service_name)}</p>${(r.items||[]).filter(i=>i.source==='manual').map(i=>`<small>+ ${esc(i.name)} · ${money(i.amount_cents)}</small>`).join('')}</div><div class="amount">${money(r.total_amount_cents)}</div></div>`).join('')}
function renderExpenses(rows){const box=$('expenseList');if(!rows.length){box.className='empty';box.textContent='Aucune dépense ce mois.';return}box.className='';box.innerHTML=rows.map(r=>`<div class="expense-item"><div><strong>${esc(r.category)} · ${money(r.amount_cents)}</strong><small>${esc(iso(r.expense_date))} — ${esc(r.description)}</small></div><button class="btn danger" onclick="removeExpense(${Number(r.id)})">Supprimer</button></div>`).join('')}
$('expenseForm').addEventListener('submit',async e=>{e.preventDefault();$('expenseError').textContent='';try{const amount=Math.round(Number($('expenseAmount').value)*100),r=await fetch('/api/admin-accounting',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({date:$('expenseDate').value,category:$('expenseCategory').value,description:$('expenseDescription').value,amount_cents:amount})}),d=await r.json();if(!r.ok)throw new Error(d.error||'Ajout impossible.');$('expenseDescription').value='';$('expenseAmount').value='';await load()}catch(x){$('expenseError').textContent=x.message}});
async function removeExpense(id){if(!confirm('Supprimer cette dépense ?'))return;const r=await fetch('/api/admin-accounting?id='+id,{method:'DELETE',credentials:'same-origin'}),d=await r.json();if(!r.ok)return alert(d.error||'Suppression impossible.');await load()}
$('month').addEventListener('change',()=>{const m=$('month').value;if(m)$('expenseDate').value=m+'-01';load()});$('exportBtn').onclick=()=>{location.href='/api/admin-accounting?format=csv&month='+encodeURIComponent($('month').value)};$('month').value=currentMonth();$('expenseDate').value=new Date().toISOString().slice(0,10);load();
</script></body></html>
