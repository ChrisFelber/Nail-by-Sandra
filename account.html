<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f0eb"><title>Mon compte — Nail by Sandra</title><style>
:root{--bg:#f8f3ef;--paper:#fffdfa;--ink:#252120;--muted:#817773;--line:#e5d9d2;--accent:#8f685f;--soft:#f1e7e1;--danger:#8b3f34;--shadow:0 18px 50px rgba(66,48,42,.08)}*{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:900px;margin:auto;padding:28px}.brand{font:400 23px Georgia,serif;letter-spacing:.08em}.eyebrow{text-transform:uppercase;letter-spacing:.22em;font-size:10px;color:var(--accent);font-weight:700}.title{font:400 42px/1.05 Georgia,serif;margin:10px 0}.muted{color:var(--muted);line-height:1.6}.auth{width:min(520px,100%);margin:45px auto;background:var(--paper);border:1px solid var(--line);border-radius:26px;padding:28px;box-shadow:var(--shadow)}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--soft);padding:5px;border-radius:999px;margin:24px 0}.tab{border:0;background:transparent;padding:10px;border-radius:999px;font-weight:700;cursor:pointer}.tab.active{background:var(--paper);box-shadow:0 3px 12px rgba(0,0,0,.06)}.form{display:grid;gap:11px}.form input{width:100%;min-width:0;border:1px solid var(--line);border-radius:13px;padding:13px;background:#fff;font:inherit}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:999px;padding:12px 17px;background:var(--ink);color:#fff;font-weight:650;cursor:pointer}.btn.secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}.error{color:var(--danger);font-size:13px}.hidden{display:none!important}.top{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:20px}.actions{display:flex;gap:8px}.panel,.next{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow);margin-bottom:15px}.panel h2{font:400 27px Georgia,serif;margin:0 0 14px}.next{background:var(--soft)}.next strong{font:400 24px Georgia,serif;display:block}.next span{display:block;color:var(--muted);margin-top:7px;line-height:1.5}.appt{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);align-items:start}.appt:last-child{border-bottom:0}.appt small,.appt p{display:block;color:var(--muted);margin:4px 0 0}.amount{font-weight:700;white-space:nowrap}.empty{text-align:center;color:var(--muted);padding:24px}.profile{color:var(--muted);line-height:1.55}@media(max-width:600px){.wrap{width:calc(100% - 40px);max-width:430px;padding:18px 0}.auth{margin:20px auto;padding:22px 18px}.title{font-size:36px}.two{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.actions,.actions .btn{width:100%}.appt{grid-template-columns:92px minmax(0,1fr);gap:11px}.amount{grid-column:2}.panel{padding:18px}}
</style></head><body><main class="wrap"><section id="auth" class="auth"><div class="brand">NAIL BY SANDRA</div><div class="eyebrow" style="margin-top:24px">Espace cliente</div><h1 class="title">Mon compte</h1><p class="muted">Retrouvez vos rendez-vous Nail by Sandra dans votre espace personnel.</p><div class="tabs"><button id="loginTab" class="tab active">Connexion</button><button id="registerTab" class="tab">Créer un compte</button></div><form id="loginForm" class="form"><input id="loginEmail" type="email" autocomplete="email" placeholder="E-mail" required><input id="loginPassword" type="password" autocomplete="current-password" placeholder="Mot de passe" required><button class="btn">Se connecter</button><div id="loginError" class="error"></div></form><form id="registerForm" class="form hidden"><div class="two"><input id="firstName" autocomplete="given-name" placeholder="Prénom" required><input id="lastName" autocomplete="family-name" placeholder="Nom" required></div><input id="email" type="email" autocomplete="email" placeholder="E-mail" required><input id="phone" type="tel" autocomplete="tel" placeholder="Téléphone (facultatif)"><input id="password" type="password" autocomplete="new-password" minlength="8" placeholder="Mot de passe · 8 caractères minimum" required><button class="btn">Créer mon compte</button><div id="registerError" class="error"></div></form><button class="btn secondary" style="width:100%;margin-top:12px" onclick="location.href='/'">Retour au site</button></section><section id="account" class="hidden"><div class="top"><div><div class="eyebrow">Espace cliente</div><h1 class="title" id="hello">Bonjour.</h1><div id="profile" class="profile"></div></div><div class="actions"><button class="btn secondary" onclick="location.href='/'">Voir le site</button><button class="btn" id="logout">Se déconnecter</button></div></div><section class="panel"><h2>Prochain rendez-vous</h2><div id="next"></div></section><section class="panel"><h2>Historique des rendez-vous</h2><div id="history"></div></section></section></main><script>
const $=id=>document.getElementById(id);let user=null;function esc(s){return String(s||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]||c))}function date(v){const s=String(v||'').slice(0,10).split('-');return s.length===3?`${s[2]}.${s[1]}.${s[0]}`:''}function time(v){return String(v||'').slice(0,5)}function money(c){return new Intl.NumberFormat('fr-CH',{style:'currency',currency:'CHF',currencyDisplay:'code',minimumFractionDigits:2}).format(Number(c||0)/100)}async function call(action,method='GET',body){const r=await fetch('/api/client?action='+action,{method,headers:body?{'Content-Type':'application/json'}:{},credentials:'same-origin',body:body?JSON.stringify(body):undefined}),d=await r.json();if(!r.ok)throw new Error(d.error||'Opération impossible.');return d}function tabs(register){$('loginTab').classList.toggle('active',!register);$('registerTab').classList.toggle('active',register);$('loginForm').classList.toggle('hidden',register);$('registerForm').classList.toggle('hidden',!register)}$('loginTab').onclick=()=>tabs(false);$('registerTab').onclick=()=>tabs(true);
async function showAccount(u){user=u;$('auth').classList.add('hidden');$('account').classList.remove('hidden');$('hello').textContent='Bonjour '+u.first_name+'.';$('profile').textContent=u.email+(u.phone?' · '+u.phone:'');try{const d=await call('appointments'),rows=d.appointments||[],up=rows.filter(x=>x.is_upcoming).sort((a,b)=>String(a.appointment_date).localeCompare(String(b.appointment_date))||String(a.appointment_start_time).localeCompare(String(b.appointment_start_time))),past=rows.filter(x=>!x.is_upcoming);$('next').innerHTML=up[0]?`<div class="next"><strong>${esc(up[0].booked_service_name)}</strong><span>${date(up[0].appointment_date)} à ${time(up[0].appointment_start_time)} · ${money(up[0].total_amount_cents)}</span></div>`:'<div class="empty">Aucun rendez-vous à venir n’est encore enregistré dans votre historique.</div>';$('history').innerHTML=past.length?past.map(x=>`<div class="appt"><div><strong>${date(x.appointment_date)}</strong><small>${time(x.appointment_start_time)}</small></div><div><strong>${esc(x.booked_service_name)}</strong><p>${x.accounting_status==='confirmed'?'Prestation confirmée':'Rendez-vous'}</p></div><div class="amount">${money(x.total_amount_cents)}</div></div>`).join(''):'<div class="empty">Aucun ancien rendez-vous enregistré.</div>'}catch(e){$('history').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginError').textContent='';try{const d=await call('login','POST',{email:$('loginEmail').value,password:$('loginPassword').value});showAccount(d.user)}catch(x){$('loginError').textContent=x.message}});$('registerForm').addEventListener('submit',async e=>{e.preventDefault();$('registerError').textContent='';try{const d=await call('register','POST',{first_name:$('firstName').value,last_name:$('lastName').value,email:$('email').value,phone:$('phone').value,password:$('password').value});showAccount(d.user)}catch(x){$('registerError').textContent=x.message}});$('logout').onclick=async()=>{await call('logout','POST',{});location.reload()};(async()=>{try{const d=await call('session');if(d.authenticated)showAccount(d.user)}catch{}})();
</script></body></html>
