name: Sync redesign assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-redesign-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy redesign images into local assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          base='https://raw.githubusercontent.com/ChrisFelber/Nail-by-Sandra-redesign/main/assets'
          for file in \
            hero-nails.jpg \
            portfolio-bijoux.jpg \
            portfolio-chrome.jpg \
            portfolio-floral.jpg \
            portfolio-french.jpg \
            salon-atmosphere.jpg \
            sandra-portrait.jpg
          do
            curl --fail --location --silent --show-error "$base/$file" --output "assets/$file"
          done

      - name: Restore local image references
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          prefix = 'https://raw.githubusercontent.com/ChrisFelber/Nail-by-Sandra-redesign/main/assets/'
          s = s.replace(prefix, 'assets/')
          p.write_text(s)
          PY

      - name: Commit synced assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/hero-nails.jpg assets/portfolio-bijoux.jpg assets/portfolio-chrome.jpg assets/portfolio-floral.jpg assets/portfolio-french.jpg assets/salon-atmosphere.jpg assets/sandra-portrait.jpg
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'Copy redesign images into main project assets'
          git push origin HEAD:main
