name: One-time hero cache bust

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cache-bust-hero.yml'

permissions:
  contents: write

jobs:
  update-hero-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add cache-busting version to hero image
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text()
          old = 'src="assets/hero-nails.jpg"'
          new = 'src="assets/hero-nails.jpg?v=20260812-1"'
          if old not in text:
              raise SystemExit('Hero image reference not found')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Force fresh hero image load"
          git push
