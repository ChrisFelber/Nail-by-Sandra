name: Update French manicure icon
on:
  push:
    paths:
      - '.github/workflows/update-french-icon.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace 100% sur mesure icon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '<div class="trust-icon" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg></div>\n        <strong>100% sur mesure</strong>'
          new = '<div class="trust-icon" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 20V10c0-3.3 1.8-5.5 4-5.5s4 2.2 4 5.5v10"/><path d="M8 20c0 1.1.9 2 2 2h4c1.1 0 2-.9 2-2"/><path d="M9.6 10.5c.5-1.6 1.3-2.5 2.4-2.5s1.9.9 2.4 2.5c-.7-.55-1.5-.8-2.4-.8s-1.7.25-2.4.8z"/><path d="M19 3v3"/><path d="M17.5 4.5h3"/></svg></div>\n        <strong>100% sur mesure</strong>'
          if old not in s:
              raise SystemExit('Current icon not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Replace custom icon with French manicure nail'
          git push
